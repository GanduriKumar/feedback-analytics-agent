<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Feedback Analytics AI">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <!-- Slightly darker (still vivid) orange + green -->
      <stop offset="0" stop-color="#00C853"/>
      <stop offset="1" stop-color="#FB8C00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Shield-like shape to convey trust/confidence -->
  <path filter="url(#shadow)" d="M32 6c8 6 16 6 22 8v18c0 14-10 22-22 26C20 54 10 46 10 32V14c6-2 14-2 22-8z" fill="url(#g)"/>

  <!-- subtle inner highlight for a more vibrant "glow" look -->
  <path d="M32 9c7 5 14 5 19 7v16c0 12-9 19-19 23C22 51 13 44 13 32V16c5-2 12-2 19-7z" fill="#FFFFFF" opacity="0.10"/>

  <!-- AI circuit/brain mark in white -->
  <g fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 24c0-4 3-7 7-7h2c4 0 7 3 7 7"/>
    <path d="M22 30c0-3 2-6 5-6h10c3 0 5 3 5 6"/>
    <path d="M24 40c0 4 3 7 7 7h2c4 0 7-3 7-7"/>
    <path d="M22 34c0 3 2 6 5 6h10c3 0 5-3 5-6"/>

    <!-- circuit nodes -->
    <circle cx="20" cy="30" r="2" fill="#FFFFFF"/>
    <circle cx="44" cy="30" r="2" fill="#FFFFFF"/>
    <circle cx="32" cy="18" r="2" fill="#FFFFFF"/>
    <circle cx="32" cy="46" r="2" fill="#FFFFFF"/>

    <path d="M22 30h-4"/>
    <path d="M46 30h4"/>
    <path d="M32 20v-4"/>
    <path d="M32 48v4"/>
  </g>
</svg>
